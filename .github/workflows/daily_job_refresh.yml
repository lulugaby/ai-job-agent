
name: Daily Job Database Refresh

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Refresh and save Greenhouse database
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"

            # Get the latest repository version
            git fetch origin main
            git reset --hard origin/main

            # Refresh jobs against the latest database
            python refresh_jobs.py

            # Stage only the public jobs database
            git add data/jobs.db

            if git diff --cached --quiet; then
              echo "Database is already up to date."
              exit 0
            fi

            # Commit updated jobs and posting dates
            git commit -m "Automated daily job refresh"

            # Push updated database
            if git push origin HEAD:main; then
              echo "Database successfully updated on GitHub!"
              exit 0
            fi

            echo "Remote branch changed. Retrying."
          done

          echo "Failed to push after 3 attempts."
          exit 1
