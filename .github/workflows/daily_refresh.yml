
name: Daily Greenhouse Job Refresh

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greenhouse-database-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Refresh Greenhouse jobs
        run: python refresh_jobs.py

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/greenhouse.db

          if ! git diff --cached --quiet; then
            git commit -m "Automated daily job refresh"
            git push
          fi
